deploymentMode: SingleBinary

singleBinary:
  replicas: 1

serviceAccount:
  create: false
  name: loki

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: s3

    bucketNames:
      chunks: hotstar-loki-logs-2026
      ruler: hotstar-loki-logs-2026
      admin: hotstar-loki-logs-2026

    s3:
      region: ap-south-1

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  

  limits_config:
    retention_period: 168h

  compactor:
    working_directory: /var/loki/compactor

  ruler:
    enable_api: true

backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

ingester:
  replicas: 0

querier:
  replicas: 0

queryFrontend:
  replicas: 0

queryScheduler:
  replicas: 0

indexGateway:
  replicas: 0

compactor:
  replicas: 0

ruler:
  replicas: 0

gateway:
  enabled: false

chunksCache:
  enabled: false

resultsCache:
  enabled: false