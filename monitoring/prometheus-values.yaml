## kube-prometheus-stack values for hotstar-clone-devsecops
## Installs: Prometheus, Grafana, AlertManager, node-exporter, kube-state-metrics

# ── Prometheus ────────────────────────────────────────────────────────────────
prometheus:
  prometheusSpec:
    retention: 7d
    resources:
      requests:
        cpu: 200m
        memory: 400Mi
      limits:
        cpu: 500m
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

    # Discover ServiceMonitors across all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}

# ── Grafana ───────────────────────────────────────────────────────────────────
grafana:
  enabled: true
  adminPassword: "${GRAFANA_ADMIN_PASSWORD}"

  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

  persistence:
    enabled: true
    storageClassName: gp2
    accessModes:
      - ReadWriteOnce
    size: 5Gi

  # Pre-built dashboards
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

  dashboards:
    default:
      kubernetes-cluster:
        gnetId: 7249
        revision: 1
        datasource: Prometheus
      kubernetes-pods:
        gnetId: 6336
        revision: 1
        datasource: Prometheus
      node-exporter:
        gnetId: 1860
        revision: 37
        datasource: Prometheus
      nginx:
        gnetId: 9614
        revision: 1
        datasource: Prometheus
      hotstar-app:
        gnetId: 12708
        revision: 1
        datasource: Prometheus

  grafana.ini:
    dashboards:
      default_home_dashboard_path: ""
    plugins:
      allow_loading_unsigned_plugins: ""

# ── AlertManager ─────────────────────────────────────────────────────────────
alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  config:
    global:
      resolve_timeout: 5m

    templates:
      - /etc/alertmanager/config/*.tmpl

    route:
      group_by: [alertname, severity, namespace]
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1m
      receiver: null-receiver
      routes:
        - matchers:
          - alertname = Watchdog
          receiver: null-receiver
        - matchers:
            - severity = critical
          receiver: slack-critical
          continue: true
        - matchers:
            - severity = warning
          receiver: slack-warning
          continue: true

    receivers:
      - name: null-receiver
      - name: slack-default
        slack_configs:
          - channel: "#dec-2025-monitoring"
            send_resolved: true
            icon_emoji: ":bell:"
            username: "AlertManager"
            title: |-
              [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
            text: |-
              {{ range .Alerts }}
              *Alert:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              *Severity:* `{{ .Labels.severity }}`
              *Namespace:* `{{ .Labels.namespace }}`
              *Started:* {{ .StartsAt.Format "2006-01-02 15:04:05" }}
              {{ end }}

      - name: slack-critical
        slack_configs:
        - channel: "#dec-2025-monitoring"
          send_resolved: true
          icon_emoji: ":red_circle:"
          username: "AlertManager | CRITICAL"
          color: '{{ if eq .Status "resolved" }}good{{ else }}danger{{ end }}'
          title: |-
            {{ if eq .Status "resolved" }}
            :white_check_mark: RESOLVED: {{ .CommonLabels.alertname }}
            {{ else }}
            :rotating_light: CRITICAL: {{ .CommonLabels.alertname }}
            {{ end }}
          text: |-
            {{ range .Alerts }}

            *Status:* `{{ .Status }}`

            {{ if eq .Status "resolved" }}

              {{ if eq .Labels.alertname "HotstarAppDown" }}
              *Alert:* Hotstar app is up
              *Description:* Replicas are available for hotstar-app deployment.
              {{ end }}

              {{ if eq .Labels.alertname "HotstarPodCrashLooping" }}
              *Alert:* Hotstar pod recovered
              *Description:* Pod is running normally.
              {{ end }}

              {{ if eq .Labels.alertname "HotstarHighCPU" }}
              *Alert:* CPU usage normalized
              *Description:* CPU utilization is below the threshold.
              {{ end }}

              {{ if eq .Labels.alertname "HotstarHighMemory" }}
              *Alert:* Memory usage normalized
              *Description:* Memory utilization is below the threshold.
              {{ end }}

              {{ if eq .Labels.alertname "NodeHighCPU" }}
              *Alert:* Node CPU usage normalized
              *Description:* Node CPU utilization is back to normal.
              {{ end }}

              {{ if eq .Labels.alertname "NodeHighMemory" }}
              *Alert:* Node memory usage normalized
              *Description:* Node memory utilization is back to normal.
              {{ end }}

              {{ if eq .Labels.alertname "NodeDiskPressure" }}
              *Alert:* Disk space recovered
              *Description:* Disk space is above the threshold.
              {{ end }}

             {{ else }}

              *Alert:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}

            {{ end }}

            *Namespace:* `{{ .Labels.namespace }}`

            {{ if eq .Labels.alertname "HotstarPodCrashLooping" }}
            *Pod:* `{{ .Labels.pod }}`
            {{ end }}

            {{ if or (eq .Labels.alertname "NodeHighCPU") (eq .Labels.alertname "NodeHighMemory") (eq .Labels.alertname "NodeDiskPressure") }}
            *Node:* `{{ .Labels.instance }}`
            {{ end }}

            *Started:* {{ .StartsAt.Format "2006-01-02 15:04:05" }}

            {{ if eq .Status "resolved" }}
            *Resolved:* {{ .EndsAt.Format "2006-01-02 15:04:05" }}
            {{ end }}

            {{ end }}

      - name: slack-warning
        slack_configs:
        - channel: "#dec-2025-monitoring"
          send_resolved: true
          icon_emoji: ":warning:"
          username: "AlertManager | WARNING"
          color: '{{ if eq .Status "resolved" }}good{{ else }}warning{{ end }}'
          title: |-
            {{ if eq .Status "resolved" }}
            :white_check_mark: RESOLVED: {{ .CommonLabels.alertname }}
            {{ else }}
            :warning: WARNING: {{ .CommonLabels.alertname }}
            {{ end }}
          text: |-
            {{ range .Alerts }}

            *Status:* `{{ .Status }}`

            {{ if eq .Status "resolved" }}

              {{ if eq .Labels.alertname "HotstarAppDown" }}
              *Alert:* Hotstar app is up
              *Description:* Replicas are available for hotstar-app deployment.
              {{ end }}

              {{ if eq .Labels.alertname "HotstarPodCrashLooping" }}
              *Alert:* Hotstar pod recovered
              *Description:* Pod is running normally.
              {{ end }}

              {{ if eq .Labels.alertname "HotstarHighCPU" }}
              *Alert:* CPU usage normalized
              *Description:* CPU utilization is below the threshold.
              {{ end }}

              {{ if eq .Labels.alertname "HotstarHighMemory" }}
              *Alert:* Memory usage normalized
              *Description:* Memory utilization is below the threshold.
              {{ end }}

              {{ if eq .Labels.alertname "NodeHighCPU" }}
              *Alert:* Node CPU usage normalized
              *Description:* Node CPU utilization is back to normal.
              {{ end }}

              {{ if eq .Labels.alertname "NodeHighMemory" }}
              *Alert:* Node memory usage normalized
              *Description:* Node memory utilization is back to normal.
              {{ end }}

              {{ if eq .Labels.alertname "NodeDiskPressure" }}
              *Alert:* Disk space recovered
              *Description:* Disk space is above the threshold.
              {{ end }}

             {{ else }}

              *Alert:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}

            {{ end }}

            *Namespace:* `{{ .Labels.namespace }}`

            {{ if eq .Labels.alertname "HotstarPodCrashLooping" }}
            *Pod:* `{{ .Labels.pod }}`
            {{ end }}

            {{ if or (eq .Labels.alertname "NodeHighCPU") (eq .Labels.alertname "NodeHighMemory") (eq .Labels.alertname "NodeDiskPressure") }}
            *Node:* `{{ .Labels.instance }}`
            {{ end }}

            *Started:* {{ .StartsAt.Format "2006-01-02 15:04:05" }}

            {{ if eq .Status "resolved" }}
            *Resolved:* {{ .EndsAt.Format "2006-01-02 15:04:05" }}
            {{ end }}

            {{ end }}

    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity = warning
        equal: [alertname, namespace]

# ── Node Exporter (EC2 node metrics) ─────────────────────────────────────────
nodeExporter:
  enabled: true

# ── Kube State Metrics (Deployment, Pod, HPA metrics) ────────────────────────
kubeStateMetrics:
  enabled: true

# ── Default scraping rules for EKS ───────────────────────────────────────────
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false        # EKS manages etcd, not accessible
    configReloaders: true
    general: true
    k8s: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlos: true
    kubelet: true
    kubeProxy: false   # EKS manages kube-proxy
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeSchedulerAlerting: false  # EKS manages scheduler
    kubeSchedulerRecording: false
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

# ── kubelet metrics for EKS ───────────────────────────────────────────────────
kubelet:
  enabled: true
  serviceMonitor:
    https: true
    insecureSkipVerify: true

kubeApiServer:
  enabled: true

kubeControllerManager:
  enabled: false   # Not accessible in EKS

kubeScheduler:
  enabled: false   # Not accessible in EKS

kubeEtcd:
  enabled: false   # Not accessible in EKS
